<aside class="tool-panel anim-slide-right" aria-label="Audit History Panel">

  <header class="panel-header">
    <div>
      <p class="eyebrow">Audit Trail</p>
      <h2>Case History</h2>
    </div>
    <button type="button" class="close-btn" (click)="closed.emit()" aria-label="Close history panel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </header>

  <!-- Filter Pills -->
  <div class="filter-strip">
    <button class="filter-pill" [class.active]="filter() === 'All'" (click)="filter.set('All')">All</button>
    <button class="filter-pill" [class.active]="filter() === 'Status'" (click)="filter.set('Status')">Status</button>
    <button class="filter-pill" [class.active]="filter() === 'Document'" (click)="filter.set('Document')">Document</button>
    <button class="filter-pill" [class.active]="filter() === 'Condition'" (click)="filter.set('Condition')">Condition</button>
  </div>

  <!-- Audit Log Timeline -->
  <div class="timeline-list">
    @for (item of filteredLogs(); track item.id) {
      <div class="timeline-card">
        <div class="tl-head">
          <span class="cat-chip cat-{{ item.category.toLowerCase() }}">{{ item.category }}</span>
          <span class="tl-time">{{ item.timestamp | date: 'MMM d, h:mm a' }}</span>
        </div>

        <strong class="action-title">{{ item.action }}</strong>
        <p class="action-detail">{{ item.detail }}</p>

        <div class="actor-row">
          <span class="actor-avatar">{{ item.actor[0] }}</span>
          <span class="actor-name">{{ item.actor }}</span>
          <span class="actor-role">· {{ item.role }}</span>
        </div>
      </div>
    } @empty {
      <div class="empty-logs">
        <p>No audit entries match this filter.</p>
      </div>
    }
  </div>

</aside>
