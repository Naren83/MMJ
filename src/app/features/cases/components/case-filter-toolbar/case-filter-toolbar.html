<div class="filter-toolbar">

  <!-- Search -->
  <div class="search-wrap">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input
      type="search"
      class="search-input"
      [ngModel]="filterSvc.searchTerm()"
      (ngModelChange)="setSearch($event)"
      placeholder="Search case, borrower, property…"
      aria-label="Search cases"
    />
    @if (filterSvc.searchTerm()) {
      <button class="clear-btn" (click)="setSearch('')" aria-label="Clear search">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    }
  </div>

  <div class="divider"></div>

  <!-- Status Pills -->
  <div class="filter-group" role="group" aria-label="Filter by status">
    <span class="filter-label">Status</span>
    <div class="pill-row">
      @for (s of statuses; track s) {
        <button
          class="pill"
          [class.active]="filterSvc.status() === s"
          [attr.data-status]="s === 'All' ? null : s.toLowerCase().replaceAll(' ', '-')"
          (click)="setStatus(s)"
        >{{ s }}</button>
      }
    </div>
  </div>

  <div class="divider"></div>

  <!-- Priority -->
  <div class="filter-group" role="group" aria-label="Filter by priority">
    <span class="filter-label">Priority</span>
    <div class="pill-row">
      @for (p of priorities; track p) {
        <button
          class="pill"
          [class.active]="filterSvc.priority() === p"
          [attr.data-priority]="p === 'All' ? null : p.toLowerCase()"
          (click)="setPriority(p)"
        >{{ p }}</button>
      }
    </div>
  </div>

  <div class="divider"></div>

  <!-- Channel Custom Select -->
  <div class="filter-group select-group">
    <span class="filter-label">Channel</span>
    <div class="custom-select-box">
      <app-custom-select
        [options]="channels()"
        [value]="filterSvc.channel()"
        (valueChange)="setChannel($event)"
      />
    </div>
  </div>

  <!-- Active Count + Clear -->
  @if (filterSvc.activeFilterCount() > 0) {
    <div class="filter-actions">
      <span class="active-badge">{{ filterSvc.activeFilterCount() }} active</span>
      <button class="clear-all-btn" (click)="clearAll()">Clear all</button>
    </div>
  }

</div>
