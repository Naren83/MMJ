<ol class="process-flow" role="list" aria-label="Review process steps">
  @for (step of steps; track step.id; let last = $last) {
    <li class="process-step {{ step.status }}">
      <button
        type="button"
        class="step-node"
        [attr.aria-current]="step.status === 'active' ? 'step' : null"
        (click)="selectStep(step.id)"
      >
        @if (step.status === 'complete') {
          <span class="step-check" aria-label="Complete">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
        } @else {
          <span class="step-badge" aria-hidden="true">{{ step.shortLabel }}</span>
        }
        <span class="step-copy">
          <strong>{{ step.label }}</strong>
          <small>{{ step.owner }}</small>
        </span>
      </button>
      @if (!last) {
        <span class="connector" aria-hidden="true"></span>
      }
    </li>
  }
</ol>
