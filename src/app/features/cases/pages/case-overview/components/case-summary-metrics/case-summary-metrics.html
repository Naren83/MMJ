<section class="metrics anim-fade-up stagger-1" aria-label="Case summary metrics">

  <article class="stat-card stat-exposure">
    <div class="stat-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="1" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    </div>
    <div class="stat-body">
      <span class="stat-label">Total Exposure</span>
      <strong class="stat-value">{{ summary.totalLoanAmount | currency: 'USD':'symbol':'1.0-0' }}</strong>
      <span class="stat-sub">Active portfolio</span>
    </div>
  </article>

  <article class="stat-card stat-urgent">
    <div class="stat-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    </div>
    <div class="stat-body">
      <span class="stat-label">High Priority</span>
      <strong class="stat-value">{{ summary.urgentCases }}</strong>
      <span class="stat-sub">Needs immediate action</span>
    </div>
  </article>

  <article class="stat-card stat-conditions">
    <div class="stat-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </div>
    <div class="stat-body">
      <span class="stat-label">Open Conditions</span>
      <strong class="stat-value">{{ summary.openConditions }}</strong>
      <span class="stat-sub">Across all cases</span>
    </div>
  </article>

  <article class="stat-card stat-sla">
    <div class="stat-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <div class="stat-body">
      <span class="stat-label">SLA Watch</span>
      <strong class="stat-value">{{ summary.closingSoon }}</strong>
      <span class="stat-sub">Closing within 12h</span>
    </div>
  </article>

</section>
